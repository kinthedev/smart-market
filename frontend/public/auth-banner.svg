<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED" />
      <stop offset="50%" stop-color="#FFEDD5" />
      <stop offset="100%" stop-color="#FED7AA" />
    </linearGradient>
    <linearGradient id="primary-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="accent-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.85" />
    </linearGradient>
    <filter id="shadow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#EA580C" flood-opacity="0.12" />
    </filter>
    <filter id="shadow-card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bg-grad)" />

  <!-- Ambient glow circles -->
  <circle cx="400" cy="400" r="280" fill="#F97316" fill-opacity="0.08" filter="blur(60px)" />
  <circle cx="250" cy="300" r="160" fill="#FBBF24" fill-opacity="0.15" filter="blur(40px)" />
  <circle cx="550" cy="550" r="200" fill="#EA580C" fill-opacity="0.07" filter="blur(50px)" />

  <!-- Decorative Pattern Grid -->
  <g opacity="0.15">
    <circle cx="150" cy="150" r="3" fill="#EA580C" />
    <circle cx="250" cy="150" r="3" fill="#EA580C" />
    <circle cx="350" cy="150" r="3" fill="#EA580C" />
    <circle cx="450" cy="150" r="3" fill="#EA580C" />
    <circle cx="550" cy="150" r="3" fill="#EA580C" />
    <circle cx="650" cy="150" r="3" fill="#EA580C" />

    <circle cx="150" cy="220" r="3" fill="#EA580C" />
    <circle cx="250" cy="220" r="3" fill="#EA580C" />
    <circle cx="350" cy="220" r="3" fill="#EA580C" />
    <circle cx="450" cy="220" r="3" fill="#EA580C" />
    <circle cx="550" cy="220" r="3" fill="#EA580C" />
    <circle cx="650" cy="220" r="3" fill="#EA580C" />
  </g>

  <!-- Main Illustration Group -->
  <g transform="translate(0, 50)">
    <!-- Platform Base -->
    <ellipse cx="400" cy="560" rx="260" ry="60" fill="#EA580C" fill-opacity="0.1" />
    <ellipse cx="400" cy="550" rx="220" ry="45" fill="#FFFFFF" fill-opacity="0.6" />

    <!-- Center Shopping Bag -->
    <g filter="url(#shadow-soft)">
      <!-- Bag Body -->
      <path d="M280 340 L520 340 L490 530 C488 542 478 550 466 550 L334 550 C322 550 312 542 310 530 Z" fill="url(#primary-orange)" />
      
      <!-- Bag Fold Highlight -->
      <path d="M280 340 L340 370 L460 370 L520 340 Z" fill="#FDBA74" fill-opacity="0.5" />
      <path d="M340 370 L340 550 L334 550 C322 550 312 542 310 530 L280 340 Z" fill="#C2410C" fill-opacity="0.3" />

      <!-- Bag Handles -->
      <path d="M350 340 C350 260 450 260 450 340" stroke="#FFF7ED" stroke-width="12" stroke-linecap="round" fill="none" />
      <path d="M350 340 C350 260 450 260 450 340" stroke="#EA580C" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.3" />

      <!-- Smart Market Cart Logo inside Bag -->
      <circle cx="400" cy="445" r="36" fill="#FFFFFF" fill-opacity="0.2" />
      <path d="M386 435 H414 L410 455 H390 Z" fill="#FFFFFF" />
      <circle cx="392" cy="462" r="3.5" fill="#FFFFFF" />
      <circle cx="408" cy="462" r="3.5" fill="#FFFFFF" />
    </g>

    <!-- Gift Box next to bag -->
    <g transform="translate(470, 430)" filter="url(#shadow-soft)">
      <rect x="0" y="25" width="100" height="90" rx="14" fill="url(#accent-amber)" />
      <rect x="-6" y="10" width="112" height="24" rx="8" fill="#F59E0B" />
      <!-- Ribbon -->
      <rect x="42" y="10" width="16" height="105" fill="#FFFFFF" fill-opacity="0.9" />
      <!-- Bow -->
      <path d="M50 10 C35 -10 20 10 50 10 C80 10 65 -10 50 10" fill="#FFFFFF" />
    </g>

    <!-- Floating AI Trend Intelligence Card -->
    <g transform="translate(140, 240)" filter="url(#shadow-card)">
      <rect width="210" height="88" rx="18" fill="url(#card-grad)" stroke="#FFFFFF" stroke-width="2" />
      
      <circle cx="38" cy="38" r="18" fill="#FFEDD5" />
      <!-- Sparkle/Trend Icon -->
      <path d="M38 27 L41 35 L49 38 L41 41 L38 49 L35 41 L27 38 L35 35 Z" fill="#F97316" />
      
      <text x="68" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748B" letter-spacing="0.5">GỢI Ý THÔNG MINH</text>
      <text x="68" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Xu Hướng Hot</text>
      <rect x="68" y="60" width="60" height="18" rx="9" fill="#FFEDD5" />
      <text x="77" y="73" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#EA580C">+86% tuần này</text>
    </g>

    <!-- Floating Trust / Discount Badge Card -->
    <g transform="translate(450, 280)" filter="url(#shadow-card)">
      <rect width="200" height="80" rx="18" fill="url(#card-grad)" stroke="#FFFFFF" stroke-width="2" />
      
      <circle cx="36" cy="40" r="18" fill="#DCFCE7" />
      <!-- Shield Check Icon -->
      <path d="M36 29 L44 32 V38 C44 43 40 47 36 49 C32 47 28 43 28 38 V32 Z" fill="#16A34A" />
      <path d="M33 39 L35 41 L40 36" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

      <text x="64" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748B">CAM KẾT 100%</text>
      <text x="64" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Chính Hãng &amp; An Toàn</text>
      <text x="64" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#16A34A">Bảo mật giao dịch</text>
    </g>

    <!-- Floating Rating Badge -->
    <g transform="translate(180, 480)" filter="url(#shadow-card)">
      <rect width="170" height="64" rx="16" fill="url(#card-grad)" stroke="#FFFFFF" stroke-width="2" />
      <circle cx="32" cy="32" r="16" fill="#FEF3C7" />
      <!-- Star Icon -->
      <polygon points="32,23 35,29 41,30 37,34 38,40 32,37 26,40 27,34 23,30 29,29" fill="#F59E0B" />
      <text x="58" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#0F172A">4.9 / 5.0</text>
      <text x="58" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748B">100K+ Đánh giá tốt</text>
    </g>
  </g>

  <!-- Bottom Text Banner Section -->
  <g transform="translate(400, 780)" text-anchor="middle">
    <!-- Badge -->
    <rect x="-125" y="0" width="250" height="32" rx="16" fill="#F97316" fill-opacity="0.12" />
    <text y="21" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#EA580C" letter-spacing="1">HỆ SINH THÁI SMART MARKET</text>

    <!-- Title -->
    <text y="70" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#0F172A">Mua Sắm &amp; Kinh Doanh</text>
    <text y="105" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#EA580C">Đón Đầu Xu Hướng AI</text>

    <!-- Subtitle -->
    <text y="145" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#64748B">
      Trải nghiệm gợi ý thông minh, ưu đãi độc quyền
    </text>
    <text y="168" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#64748B">
      và hàng triệu sản phẩm chất lượng cao mỗi ngày.
    </text>
  </g>
</svg>